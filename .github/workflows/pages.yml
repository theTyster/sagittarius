name: Publish site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Rebuild the short deck
        run: python3 site/build_essentials.py

      - name: Fail if essentials.html is stale
        run: |
          if ! git diff --exit-code -- site/essentials.html; then
            echo "::error file=site/essentials.html::Stale. Run 'python3 site/build_essentials.py' and commit the result."
            exit 1
          fi

      # The short deck is the landing page; the full deck is full.html.
      - name: Stage the public files
        run: |
          mkdir _site
          sed 's/href="index\.html/href="full.html/g' site/essentials.html > _site/index.html
          sed 's/href="essentials\.html/href=".\//g' site/index.html > _site/full.html
          if grep -q 'href="\(index\|essentials\)\.html' _site/index.html _site/full.html; then
            echo "::error::A deck still links to a source file name."
            exit 1
          fi
          touch _site/.nojekyll

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
